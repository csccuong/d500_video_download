# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Disable built-in Kotlin support in AGP 9.0+ to allow standard kotlin-android and kapt plugins
android.builtInKotlin=false
android.newDsl=false

# AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# Kotlin settings
kotlin.code.style=official
kotlin.skip.metadata.version.check=true

# Disable VFS watch to prevent Windows file locking issues
org.gradle.vfs.watch=false
